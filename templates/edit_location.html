{% extends "base.html" %}

{% block title %}修改位置{% endblock %}

{% block content %}
<section class="box">
    <h1>修改位置</h1>

    <form method="post" action="/locations/{{ location.id }}/edit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="location-floor">楼层</label>
        <select id="location-floor" name="floor" required>
            {% for floor in floors %}
                <option value="{{ floor }}" {% if floor == location.floor %}selected{% endif %}>
                    {{ floor }}
                </option>
            {% endfor %}
        </select>

        <label for="location-room">房间 / 区域</label>
        <input
            id="location-room"
            type="text"
            name="room"
            value="{{ location.room }}"
            maxlength="50"
            required
        >

        <label for="location-spot">具体位置</label>
        <input
            id="location-spot"
            type="text"
            name="spot"
            value="{{ location.spot }}"
            maxlength="50"
            required
        >

        <button class="button button-primary" type="submit">保存修改</button>
    </form>

    <a href="/locations">返回位置管理</a>
</section>
{% endblock %}
