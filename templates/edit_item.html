{% extends "base.html" %}
{% from "_macros.html" import location_picker with context %}

{% block title %}修改物品{% endblock %}

{% block content %}
<section class="box">
    <h1>修改物品</h1>

    <form method="post" action="/items/{{ item.id }}/edit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="item-name">物品名称</label>
        <input
            id="item-name"
            type="text"
            name="name"
            value="{{ item.name }}"
            maxlength="100"
            required
        >

        <fieldset>
            <legend>存放位置</legend>
            {{ location_picker(location_groups, item.location_id) }}
        </fieldset>

        <label for="item-quantity">数量 / 简短备注</label>
        <input
            id="item-quantity"
            type="text"
            name="quantity"
            value="{{ item.quantity or '' }}"
            maxlength="200"
        >

        <label for="item-tags">标签</label>
        <input
            id="item-tags"
            type="text"
            name="tags"
            value="{{ item.tags or '' }}"
            maxlength="200"
        >

        <button class="button button-primary" type="submit">保存修改</button>
    </form>

    <a href="/">返回首页</a>
</section>
{% endblock %}
